{{- range $name, $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: telcopulse
    {{- if ne $name "web" }}
    telcopulse.io/metrics: "true"
    telcopulse.io/scrape-job: telcopulse
    {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ if eq $name "web" }}3000{{ else }}8080{{ end }}
      targetPort: http
    {{- if and (eq $name "incident-service") (eq $.Values.alerting.ingestion "alertmanager") }}
    - name: alert-webhook
      port: 9094
      targetPort: alert-webhook
    {{- end }}
---
{{- end }}
