image:
  registry: registry.example.invalid/telcopulse
  tag: dev
  pullPolicy: IfNotPresent

existingSecret: telcopulse-runtime
imagePullSecrets: []

runtime:
  appMode: local
  authRequired: "true"
  webOrigin: https://telcopulse.example.invalid
  otlpEndpoint: ""
  redisURL: redis://redis:6379/0
  kafkaBrokers: kafka:9092
  prometheusURL: ""
  prometheusViewerURL: ""
  traceViewerURL: ""
  prometheusEnvironment: development
  prometheusSource: kubernetes-prometheus
  purchasesPerMinute: "60"

# Values below contain endpoints and existing Secret key names, never credentials.
observability:
  splunk:
    hecURL: ""
    hecIndex: telcopulse
    hecTokenKey: SPLUNK_HEC_TOKEN
    searchURL: ""
    searchIndex: telcopulse
    searchTokenKey: SPLUNK_SEARCH_TOKEN
  otlp:
    authorizationKey: ""
    certificateKey: ""
  jaeger:
    queryURL: ""
  datadog:
    metricsURL: ""
    tokenKey: DATADOG_TOKEN

migration:
  enabled: true

bootstrap:
  # The one-time local account bootstrap requires AUTH_BOOTSTRAP_PASSWORD in
  # existingSecret. Disable when the database already has an administrator.
  enabled: false

serviceAccount:
  create: true

ingress:
  enabled: false
  className: ""
  host: telcopulse.example.invalid
  tlsSecretName: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

services:
  auth-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN]
  subscriber-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN]
  package-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN]
  payment-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN]
  notification-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN, NOTIFICATION_OPERATOR_TOKEN]
  incident-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN, INCIDENT_OPERATOR_TOKEN]
  simulation-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN, SIMULATION_OPERATOR_TOKEN]
  deployment-service:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN]
  api-gateway:
    replicas: 1
    secretKeys: [DATABASE_URL, SERVICE_TOKEN, INCIDENT_OPERATOR_TOKEN, SIMULATION_OPERATOR_TOKEN, NOTIFICATION_OPERATOR_TOKEN]
  web:
    replicas: 1
    secretKeys: []

# Alert ingestion for incident-service. "alertmanager" opens a webhook listener on
# port 9094 that only accepts ALERT_WEBHOOK_TOKEN from existingSecret; use it with
# monitoring.alertmanagerConfig. "prometheus" polls runtime.prometheusURL.
alerting:
  ingestion: prometheus
  webhookTokenKey: ALERT_WEBHOOK_TOKEN

# Prometheus Operator resources (kube-prometheus-stack). Each requires the
# monitoring.coreos.com CRDs; labels must match the operator's selectors.
monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 15s
  prometheusRule:
    enabled: false
    labels: {}
    # Groups from files/rules.yml. "dependencies" needs the exporters that the
    # Compose stack runs; kube-prometheus-stack already ships its own Watchdog
    # and Alertmanager meta-alerts.
    groups: [telcopulse]
    slo: true
  alertmanagerConfig:
    enabled: false
    labels: {}
    telegram:
      enabled: false
      botTokenKey: TELEGRAM_BOT_TOKEN
      # Numeric chat ID (not a secret), for example -1001234567890.
      chatID: 0

# Optional hourly pg_dump CronJob writing to a PVC (see docs/disaster-recovery.md).
backup:
  enabled: false
  schedule: "0 * * * *"
  retain: 48
  size: 2Gi
  storageClassName: ""
  image: postgres:17-alpine

# Capacity guardrails from docs/capacity.md. The chart refuses to render when the
# largest gateway replica count times its pool, plus 8 connections per other Go
# service pod and the reserve, exceeds the database's max_connections.
capacity:
  # Two staging replicas x 12 + 64 + 10 = 98. Compose runs one gateway with 20.
  gatewayDatabaseMaxConns: 12
  databaseMaxConnections: 100
  # Backup and migration jobs, exporters and operator sessions.
  reservedConnections: 10
