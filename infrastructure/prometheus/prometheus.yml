global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/slo-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: telcopulse
    honor_labels: true
    scrape_timeout: 4s
    static_configs:
      - targets: [api-gateway:8080]
        labels: {service: api-gateway}
      - targets: [auth-service:8080]
        labels: {service: auth-service}
      - targets: [subscriber-service:8080]
        labels: {service: subscriber-service}
      - targets: [package-service:8080]
        labels: {service: package-service}
      - targets: [payment-service:8080]
        labels: {service: payment-service}
      - targets: [notification-service:8080]
        labels: {service: notification-service}
      - targets: [incident-service:8080]
        labels: {service: incident-service}
      - targets: [simulation-service:8080]
        labels: {service: simulation-service}
      - targets: [deployment-service:8080]
        labels: {service: deployment-service}
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: {dependency: postgres}
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
        labels: {dependency: redis}
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
        labels: {dependency: kafka}
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  # Blackbox probes: the probed URL becomes the instance label.
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://web:3000/"]
        labels: {probe_class: user-facing, probe_name: web-console}
      - targets: ["http://api-gateway:8080/readyz"]
        labels: {probe_class: internal, probe_name: api-gateway-ready}
      - targets: ["http://alertmanager:9093/-/ready", "http://grafana:3000/api/health", "http://jaeger:16686/", "http://loki:3100/ready"]
        labels: {probe_class: internal}
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox-tcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ["postgres:5432"]
        labels: {probe_class: dependency, dependency: postgres}
      - targets: ["kafka:9092"]
        labels: {probe_class: dependency, dependency: kafka}
      - targets: ["redis:6379"]
        labels: {probe_class: dependency, dependency: redis}
    relabel_configs: *probe_relabel
