groups:
  - name: telcopulse
    rules:
      - record: telcopulse:business_success_ratio:rate5m
        expr: sum by (environment) (rate(transaction_total{status="SUCCESS"}[5m])) / sum by (environment) (rate(transaction_total[5m]))
      - record: telcopulse:business_decline_ratio:increase1h
        expr: sum by (environment) (increase(transaction_total{status="FAILED",failure_class="business"}[1h])) / sum by (environment) (increase(transaction_total[1h]))
      - record: telcopulse:http_p95_seconds:rate5m
        expr: histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))
      # Burn-rate alerts read the Sloth-generated SLI recordings in slo-rules.yml.
      # 14.4x and 6x of each budget, with short-window traffic floors; see docs/slo.md.
      - alert: BusinessSuccessRateLow
        expr: |
          (
            sum by (environment) (slo:sli_error:ratio_rate5m{sloth_slo="purchase-success"}) > (14.4 * 0.001)
            and on(environment) sum by (environment) (slo:sli_error:ratio_rate1h{sloth_slo="purchase-success"}) > (14.4 * 0.001)
            and on(environment) sum by (environment) (increase(transaction_total[5m])) >= 5
          ) or (
            sum by (environment) (slo:sli_error:ratio_rate30m{sloth_slo="purchase-success"}) > (6 * 0.001)
            and on(environment) sum by (environment) (slo:sli_error:ratio_rate6h{sloth_slo="purchase-success"}) > (6 * 0.001)
            and on(environment) sum by (environment) (increase(transaction_total[30m])) >= 30
          )
        for: 30s
        labels: {severity: SEV-2}
        annotations:
          runbook_url: docs/runbooks/high-error-rate.md
          summary: "Synthetic purchase SLO budget burning in {{ $labels.environment }}"
          description: "30-day 99.9% objective: paired 5m/1h burn exceeds 14.4x, or 30m/6h burn exceeds 6x. Check terminal sample count and failed transaction IDs in TelcoPulse."
      - alert: PurchaseLatencyBudgetBurn
        expr: |
          (
            sum by (environment) (slo:sli_error:ratio_rate5m{sloth_slo="purchase-latency"}) > (14.4 * 0.01)
            and on(environment) sum by (environment) (slo:sli_error:ratio_rate1h{sloth_slo="purchase-latency"}) > (14.4 * 0.01)
            and on(environment) sum by (environment) (increase(transaction_duration_seconds_count[5m])) >= 5
          ) or (
            sum by (environment) (slo:sli_error:ratio_rate30m{sloth_slo="purchase-latency"}) > (6 * 0.01)
            and on(environment) sum by (environment) (slo:sli_error:ratio_rate6h{sloth_slo="purchase-latency"}) > (6 * 0.01)
            and on(environment) sum by (environment) (increase(transaction_duration_seconds_count[30m])) >= 30
          )
        for: 30s
        labels: {severity: SEV-2, service: api-gateway}
        annotations:
          runbook_url: docs/runbooks/high-latency.md
          summary: "Synthetic purchase latency SLO budget burning in {{ $labels.environment }}"
          description: "30-day objective: 99% of completed purchases within 2 s. Paired 5m/1h burn exceeds 14.4x, or 30m/6h burn exceeds 6x. Compare per-service P95 to find the slow dependency."
      - alert: NotificationFreshnessBudgetBurn
        expr: |
          (
            sum by (environment) (slo:sli_error:ratio_rate5m{sloth_slo="notification-freshness"}) > (14.4 * 0.01)
            and on(environment) sum by (environment) (slo:sli_error:ratio_rate1h{sloth_slo="notification-freshness"}) > (14.4 * 0.01)
            and on(environment) sum by (environment) (increase(notification_delivery_freshness_seconds_count[5m])) >= 5
          ) or (
            sum by (environment) (slo:sli_error:ratio_rate30m{sloth_slo="notification-freshness"}) > (6 * 0.01)
            and on(environment) sum by (environment) (slo:sli_error:ratio_rate6h{sloth_slo="notification-freshness"}) > (6 * 0.01)
            and on(environment) sum by (environment) (increase(notification_delivery_freshness_seconds_count[30m])) >= 30
          )
        for: 30s
        labels: {severity: SEV-2, service: notification-service}
        annotations:
          runbook_url: docs/runbooks/kafka-consumer-lag.md
          summary: "Notification freshness SLO budget burning in {{ $labels.environment }}"
          description: "30-day objective: 99% of notifications delivered within 30 s of the purchase outcome. Paired 5m/1h burn exceeds 14.4x, or 30m/6h burn exceeds 6x. Undelivered events are not counted until delivered; check consumer lag and outbox age."
      - alert: ServiceLatencyHigh
        expr: telcopulse:http_p95_seconds:rate5m > 1 and on(service) sum by (service) (increase(http_request_duration_seconds_count[5m])) >= 20
        for: 30s
        labels: {severity: SEV-2}
        annotations:
          runbook_url: docs/runbooks/high-latency.md
          summary: "{{ $labels.service }} HTTP P95 exceeds one second"
          description: "Shared-runtime HTTP telemetry: at least twenty requests in five minutes. Investigate the affected dependency; customer impact and environment require confirmation."
      - alert: ServiceUnavailable
        expr: up{job="telcopulse"} == 0
        for: 30s
        labels: {severity: SEV-1}
        annotations:
          runbook_url: docs/runbooks/pod-crashloopbackoff.md
          summary: "{{ $labels.service }} metrics target unavailable"
      - alert: NotificationConsumerLag
        expr: sum(kafka_consumer_lag) > 10
        for: 30s
        labels: {severity: SEV-2, service: notification-service}
        annotations:
          runbook_url: docs/runbooks/kafka-consumer-lag.md
          summary: "Notification group is more than ten records behind"
      - alert: EventPublicationDelayed
        expr: event_outbox_oldest_age_seconds > 30
        for: 30s
        labels: {severity: SEV-2}
        annotations:
          runbook_url: docs/architecture/events.md
          summary: "{{ $labels.service }} has unpublished events older than 30 seconds"
      - alert: KafkaLagMeasurementUnavailable
        expr: kafka_lag_collection_success == 0
        for: 30s
        labels: {severity: SEV-3, service: notification-service}
        annotations:
          runbook_url: docs/runbooks/kafka-consumer-lag.md
          summary: "Notification lag could not be measured"
      - alert: LogExportLoss
        expr: sum by (service) (increase(log_export_events_total{outcome=~"failed|dropped"}[5m])) > 0
        for: 30s
        labels: {severity: SEV-3}
        annotations:
          runbook_url: docs/splunk.md
          summary: "{{ $labels.service }} log export lost events"
          description: "Failed or dropped exports observed in five minutes. Check receiver availability, token/index permissions and queue pressure; stdout remains the primary log stream."
  - name: alerting-pipeline
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: "Always firing. An external dead-man's switch pages when these notifications stop arriving."
      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[10m])) > 0
        for: 1m
        labels: {severity: SEV-2}
        annotations:
          summary: "Alertmanager {{ $labels.integration }} deliveries are failing"
          description: "Notifications to this integration failed in the last ten minutes. Incidents or pages may be missing; check Alertmanager logs and receiver credentials."
          runbook_url: docs/on-call.md
      - alert: AlertmanagerUnreachable
        expr: (sum(prometheus_notifications_alertmanagers_discovered) or vector(0)) < 1 or sum(increase(prometheus_notifications_errors_total[5m])) > 0
        for: 2m
        labels: {severity: SEV-1}
        annotations:
          summary: "Prometheus cannot deliver alerts to Alertmanager"
          description: "No notification or incident is produced while this fires. Check the Prometheus and Grafana alert views directly and restore Alertmanager."
          runbook_url: docs/on-call.md
