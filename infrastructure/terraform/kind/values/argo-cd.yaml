# Minimal Argo CD for the GitOps evaluation: no Dex, notifications or
# ApplicationSet controller, single replicas.
dex: {enabled: false}
notifications: {enabled: false}
applicationSet: {replicas: 0}
configs:
  params:
    server.insecure: true
redis:
  resources: {requests: {cpu: 10m, memory: 32Mi}}
controller:
  resources: {requests: {cpu: 50m, memory: 128Mi}}
repoServer:
  resources: {requests: {cpu: 20m, memory: 64Mi}}
server:
  resources: {requests: {cpu: 20m, memory: 64Mi}}
