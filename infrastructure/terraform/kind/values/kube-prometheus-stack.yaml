grafana:
  enabled: false
# Pick up resources from every namespace, not only those labelled for this release.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 300Mi}
      limits: {memory: 1Gi}
alertmanager:
  alertmanagerSpec:
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    # Keep the chart's own routing; namespaced AlertmanagerConfigs are merged in.
    alertmanagerConfigMatcherStrategy:
      type: OnNamespace
    resources:
      requests: {cpu: 10m, memory: 32Mi}
prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
# kind's control-plane components bind to localhost; skip unreachable targets.
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
kubeEtcd: {enabled: false}
